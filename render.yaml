services:
  - type: web
    name: banking-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # No persistent disk on the free plan — data/ resets on every restart or
    # redeploy (login accounts + connected banks). Switch back to `starter`
    # and re-add the `disk:` block above once you want that to persist.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false
